<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スクリーンショット合計計算</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .container { width: 100%; max-width: 680px; }
    h1 { text-align: center; font-size: 22px; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 24px; }
    .drop-zone { border: 2.5px dashed #b0bec5; border-radius: 16px; background: #fff; padding: 48px 24px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .drop-zone.dragging { border-color: #4f6ef7; background: #f0f3ff; }
    .drop-icon { font-size: 48px; margin-bottom: 12px; display: block; }
    .drop-text { font-size: 16px; color: #555; margin-bottom: 8px; }
    .drop-sub { font-size: 12px; color: #999; }
    .btn-upload { display: inline-block; margin-top: 16px; padding: 10px 28px; background: #4f6ef7; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    #fileInput { display: none; }
    .preview-wrap { margin-top: 20px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); display: none; }
    .preview-wrap.show { display: block; }
    #previewImg { max-width: 100%; border-radius: 10px; border: 1px solid #e0e0e0; display: block; margin: 0 auto 16px; }
    .progress-bar-wrap { background: #e8eaf6; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4f6ef7, #7c4dff); border-radius: 6px; transition: width 0.3s; }
    .progress-label { font-size: 12px; color: #666; text-align: center; margin-bottom: 16px; }
    .results { display: none; }
    .results.show { display: block; }
    .numbers-list { background: #f7f8fc; border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; }
    .numbers-list-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; margin-bottom: 10px; }
    .number-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e8eaf0; font-size: 15px; color: #333; }
    .number-item:last-child { border-bottom: none; }
    .number-value { font-weight: 600; color: #1a1a2e; }
    .total-box { background: linear-gradient(135deg, #4f6ef7, #7c4dff); border-radius: 14px; padding: 22px 24px; color: #fff; text-align: center; }
    .total-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
    .total-amount { font-size: 38px; font-weight: 700; }
    .no-numbers { text-align: center; color: #f44336; padding: 16px; font-size: 14px; }
    .btn-reset { display: block; width: 100%; margin-top: 16px; padding: 10px; background: transparent; border: 1.5px solid #ccc; border-radius: 8px; font-size: 13px; color: #666; cursor: pointer; }
    .raw-text-toggle { font-size: 11px; color: #aaa; text-align: center; cursor: pointer; margin-top: 12px; text-decoration: underline; }
    .raw-text { display: none; margin-top: 8px; background: #f5f5f5; border-radius: 8px; padding: 10px 14px; font-size: 11px; color: #666; white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
    .raw-text.show { display: block; }
  </style>
</head>
<body>
<div class="container">
  <h1>📸 スクリーンショット合計計算</h1>
  <p class="subtitle">画像をドロップ or クリックしてアップロード → 数字を自動読み取りして合計を表示</p>
  <div class="drop-zone" id="dropZone">
    <span class="drop-icon">🖼️</span>
    <p class="drop-text">ここに画像をドラッグ＆ドロップ</p>
    <p class="drop-sub">PNG / JPG / スクリーンショット など</p>
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg" src="" alt="プレビュー">
    <div class="progress-bar-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-label" id="progressLabel">読み取り中...</p>
    <div class="results" id="results">
      <div class="numbers-list" id="numbersList"></div>
      <div class="total-box" id="totalBox"></div>
      <div class="raw-text-toggle" onclick="toggleRaw()">▼ OCRテキスト全文を見る</div>
      <div class="raw-text" id="rawText"></div>
      <button class="btn-reset" onclick="reset()">↩ 別の画像を試す</button>
    </div>
  </div>
</div>
<script>
  const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),previewWrap=document.getElementById('previewWrap'),previewImg=document.getElementById('previewImg'),progressBar=document.getElementById('progressBar'),progressLabel=document.getElementById('progressLabel'),results=document.getElementById('results'),numbersList=document.getElementById('numbersList'),totalBox=document.getElementById('totalBox'),rawText=document.getElementById('rawText');
  dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragging');});
  dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragging'));
  dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragging');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))processFile(f);});
  dropZone.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')fileInput.click();});
  fileInput.addEventListener('change',e=>{if(e.target.files[0])processFile(e.target.files[0]);});
  document.addEventListener('paste',e=>{const items=e.clipboardData.items;for(const item of items){if(item.type.startsWith('image/')){processFile(item.getAsFile());break;}}});
  function processFile(file){
    const url=URL.createObjectURL(file);
    previewImg.src=url;previewWrap.classList.add('show');dropZone.style.display='none';results.classList.remove('show');
    progressBar.style.width='0%';progressLabel.textContent='読み取り準備中...';document.getElementById('progressWrap').style.display='block';
    Tesseract.recognize(url,'jpn+eng',{logger:m=>{if(m.status==='recognizing text'){const pct=Math.round(m.progress*100);progressBar.style.width=pct+'%';progressLabel.textContent='読み取り中... '+pct+'%';}else if(m.status){progressLabel.textContent=m.status;}}}).then(({data:{text}})=>{document.getElementById('progressWrap').style.display='none';showResults(text);}).catch(err=>{progressLabel.textContent='エラーが発生しました: '+err.message;});
  }
  function showResults(text) {
    rawText.textContent = text;
    var t = text
      .replace(/[０-９]/gu, function(c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[，、]/g, ',')
      .replace(/．/g, '.');
    // Fix: rejoin numbers split across lines at comma boundaries
    // e.g. "46,832,\n212円" -> "46,832,212円"
    for (var fi = 0; fi < 4; fi++) {
      t = t.replace(/([0-9]{1,3}),[ \t]*[\r\n]+[ \t]*([0-9])/g, '$1,$2');
    }
    // Fix: remove spaces OCR inserts after commas within numbers
    // e.g. "15, 753, 879円" -> "15,753,879円"
    for (var fj = 0; fj < 4; fj++) {
      t = t.replace(/([0-9]{1,3}),[ \t]+([0-9]{3})(?=[,円¥￥\r\n\s]|$)/g, '$1,$2');
    }
    var seen = new Set();
    var unique = [];
    function addNum(str) {
      var num = parseFloat(str.replace(/,/g, ''));
      if (!isNaN(num) && num > 0 && !seen.has(num)) { seen.add(num); unique.push({ value: num }); }
    }
    var yenPat = /([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?)\s*円/g;
    var m;
    while ((m = yenPat.exec(t)) !== null) addNum(m[1]);
    if (unique.length === 0) {
      var symPat = /[¥￥]\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?)/g;
      while ((m = symPat.exec(t)) !== null) addNum(m[1]);
    }
    if (unique.length === 0) {
      var commaPat = /([0-9]{1,3}(?:,[0-9]{3})+(?:\.[0-9]+)?)/g;
      while ((m = commaPat.exec(t)) !== null) addNum(m[1]);
    }
    if (unique.length === 0) {
      var plainPat = /\b([0-9]{2,})\b/g;
      while ((m = plainPat.exec(t)) !== null) addNum(m[1]);
    }
    results.classList.add('show');
    if (unique.length === 0) {
      numbersList.innerHTML = '<div class="no-numbers">数字が見つかりませんでした。<br>画像を確認してください。</div>';
      totalBox.innerHTML = '';
    } else {
      var total = unique.reduce(function(s, f) { return s + f.value; }, 0);
      numbersList.innerHTML = '<div class="numbers-list-title">検出された数値（' + unique.length + '件）</div>' +
        unique.map(function(f, i) { return '<div class="number-item"><span>数値 ' + (i+1) + '</span><span class="number-value">' + fmt(f.value) + '</span></div>'; }).join('');
      totalBox.innerHTML = '<div class="total-label">合 計</div><div class="total-amount">¥ ' + fmt(total) + '</div>';
    }
  }

  function fmt(n){return n.toLocaleString('ja-JP',{maximumFractionDigits:2});}
  function toggleRaw(){rawText.classList.toggle('show');}
  function reset(){dropZone.style.display='';previewWrap.classList.remove('show');previewImg.src='';fileInput.value='';results.classList.remove('show');rawText.classList.remove('show');}
</script>
</body>
</html>
